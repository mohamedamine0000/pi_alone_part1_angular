<app-header></app-header>
<div class="main-content">
    <div class="page-content mt-5 pt-5">
        <div class="container">
            <h2>Machines in {{gym?.gymName}}</h2>
            
            <button class="add-machine-btn" [routerLink]="['/extrapages/add-machine', gymId]">Add Machine</button>
            
            <div class="machine-container">
              <div class="machine-card" *ngFor="let machine of machines">
                <!-- Machine 3D View -->
                <div class="machine-3d-container" *ngIf="machine.machine_3d">
                    <iframe
                    [src]="machine.machine_3d | safeUrl"
                    width="100%"
                    height="300"
                    frameborder="0"
                    allowfullscreen
                    loading="lazy"
                  ></iframe>
                </div>
                
                <!-- Machine Details -->
                <div class="machine-details">
                  <h3>{{ machine.machine_name }}</h3>
                  <p><strong>Muscles Worked:</strong> {{ machine.muscles_touched }}</p>
                  <p><strong>Activities Included:</strong> {{ machine.activities_included }}</p>
                  
                  <button (click)="deleteMachine(machine.machine_id)" class="btn btn-danger">Delete</button>
                  <a [routerLink]="['/extrapages/update-machine', machine.machine_id]" class="btn btn-warning">Edit</a>
                </div>
              </div>
            </div>
            
            <!-- Styles -->
            <style>
              .machine-container {
                display: flex;
                flex-wrap: wrap;
                gap: 20px;
                justify-content: center;
              }
              .machine-card {
                width: 350px;
                border: 1px solid #ccc;
                border-radius: 10px;
                overflow: hidden;
                box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
                background: #fff;
              }
              .machine-3d-container {
                width: 100%;
                height: 250px;
              }
              .machine-3d-container iframe {
                width: 100%;
                height: 100%;
                border: none;
              }
              .machine-details {
                padding: 15px;
              }
              .add-machine-btn {
                background-color: #4CAF50;
                color: white;
                padding: 10px 15px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                margin-bottom: 20px;
              }
              @media (max-width: 768px) {
                .machine-card {
                  width: 100%;
                }
              }
            </style>
        </div>
    </div>
</div>
<app-footer></app-footer>
