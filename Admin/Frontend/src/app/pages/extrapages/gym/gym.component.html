<app-header></app-header>
<div class="main-content">
    <div class="page-content mt-5 pt-5">
        <div class="container">
            <h2>Available Gyms</h2>
            
            <div class="gym-container">
              <div class="gym-card" *ngFor="let gym of gyms">
                <!-- Matterport 3D Tour -->
                <div class="matterport-tour-container">
                    <iframe
                    [src]="gym.gym_3d | safeUrl"
                    width="100%"
                    height="300"
                    frameborder="0"
                    allowfullscreen
                    loading="lazy"

                  ></iframe>
                  
                </div>
                <!-- Gym Details -->
                <div class="gym-details">
                  <h3>{{ gym.gymName }}</h3>
                  <p><strong>Location:</strong> {{ gym.location }}</p>
                  <p><strong>Subscription Fee:</strong> {{ gym.subscription_fee }} TND</p>
                  <button (click)="viewDetails(gym.gym_id)">Details</button>


                </div>
              </div>
            </div>
            
            <!-- Styles -->
            <style>
              .gym-container {
                display: flex;
                flex-wrap: wrap;
                gap: 20px;
                justify-content: center;
              }
              .gym-card {
                width: 350px;
                border: 1px solid #ccc;
                border-radius: 10px;
                overflow: hidden;
                box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
                background: #fff;
              }
              .matterport-tour-container {
                width: 100%;
                height: 250px;
              }
              .matterport-tour-container iframe {
                width: 100%;
                height: 100%;
                border: none;
              }
              .gym-details {
                padding: 15px;
              }
              @media (max-width: 768px) {
                .gym-card {
                  width: 100%;
                }
              }
            </style>
            

        </div>
    </div>
</div>
<app-footer></app-footer>
